urs to be confirmed\u003c/span>\u003c/span>\u003c/div>\n\u003ca href=\"/doctors\" class=\"card\" style=\"text-decoration: none; color: #0D1410\">\u003cspan style=\"font-size: 15px; color: #1D7A3E\">Specialist OPD days\u003c/span>\u003cspan style=\"font-size: 20px; letter-spacing: -0.02em\">Doctors &amp; OPD schedule →\u003c/span>\u003c/a>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap sec\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 48px 80px\">\n\u003cdiv style=\"flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n\u003cspan class=\"tag\">Before you come\u003c/span>\u003ch2 class=\"h2\">What to bring\u003c/h2>\n\u003cp class=\"muted\">Bringing these helps the doctor see your history and saves you time at registration.\u003c/p>\n\u003c/div>\n\u003cdiv style=\"flex: 1.3 1 460px; min-width: 0\">\n\u003cdiv class=\"item\">A photo ID, such as your Aadhaar card\u003c/div>\n\u003cdiv class=\"item\">Previous prescriptions, test reports and X-rays\u003c/div>\n\u003cdiv class=\"item\">A list of the medicines you are taking now\u003c/div>\n\u003cdiv class=\"item\">Ayushman Bharat, insurance or other scheme card, if you have one\u003c/div>\n\u003cdiv class=\"item\">For pregnancy visits: your antenatal card and reports\u003c/div>\n\u003cdiv class=\"item\">For children: the vaccination card\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap sec\">\n\u003cdiv class=\"head\">\u003cspan class=\"tag\">Staying with a patient\u003c/span>\u003ch2 class=\"h2\">Attendants and visitors\u003c/h2>\u003c/div>\n\u003cdiv class=\"grid4\">\n\u003cdiv class=\"card-w\">\u003cspan class=\"h3\">Attendants\u003c/span>\u003cp class=\"muted\">How many family members can stay with a patient on the ward, and passes.\u003c/p>\u003cspan class=\"tbc\">Attendant policy to be confirmed\u003c/span>\u003c/div>\n\u003cdiv class=\"card-w\">\u003cspan class=\"h3\">ICU and NICU visits\u003c/span>\u003cp class=\"muted\">Visiting bute('data-anim', 'on');\n      this.__io = new IntersectionObserver((entries) => {\n        entries.forEach((en) => {\n          if (en.isIntersecting) { en.target.setAttribute('data-in', ''); this.__io.unobserve(en.target); }\n        });\n      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n      els.forEach((el) => this.__io.observe(el));\n    } catch (e) {}\n  }\n  opd() {\n    // OPD closed on Sundays and on these holidays (emergency stays open). Edit as the hospital announces closures.\n    // 'MM-DD' repeats every year; 'YYYY-MM-DD' is a one-off date.\n    const HOLIDAYS = ['01-26', '08-15', '10-02', '12-25'];\n    const now = new Date();\n    const ist = new Date(now.getTime() + (330 + now.getTimezoneOffset()) * 60000);\n    const p2 = (n) => String(n).padStart(2, '0');\n    const md = (dt) => p2(dt.getMonth() + 1) + '-' + p2(dt.getDate());\n    const isHol = (dt) => HOLIDAYS.includes(md(dt)) || HOLIDAYS.includes(dt.getFullYear() + '-' + md(dt));\n    const hours = (dt) => (dt.getDay() === 0 || isHol(dt)) ? null : (dt.getDay() === 6 ? [8, 11.5, '11:30 am'] : [8, 14.5, '2:30 pm']);\n    const h = ist.getHours() + ist.getMinutes() / 60;\n    const today = hours(ist);\n    if (today && h >= today[0] && h \u003c today[1]) return { open: true, t: 'OPD open now', s: 'Until ' + today[2] + ' today', nav: 'OPD open now · until ' + today[2], line: 'OPD open now · Emergency open 24 hours' };\n    if (today && h \u003c today[0]) return { open: false, t: 'OPD opens at 8:00 am', s: 'Emergency is open now', nav: 'OPD opens today at 8:00 am', line: 'OPD opens at 8:00 am · Emergency open 24 hours' };\n    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];\n    let next = 'soon';\n    for (let i = 1; i \u003c 14; i++) { const dt = new Date(ist.getTime() + i * 86400000); if (hours(dt)) { next = i === 1 ? 'tomorrow' : days[dt.getDay()]; break; } }\n    const hol = isHol(ist);\n    return {\n      open: false,\n      t: hol ? 'OPD closed today · holiday' : 'OPD opens ' + next,\n      s: hol ? 'Opens ' + next + ' · Emergency open' : 'Emergency is open now',\n      nav: (hol ? 'OPD closed today (holiday) · opens ' : 'OPD opens ') + next + ' at 8:00 am',\n      line: (hol ? 'OPD closed today (holiday) · opens ' : 'OPD opens ') + next + ' 8:00 am · Emergency open 24 hours'\n    };\n  }\n\n  fill(rows, keys) {\n    return rows.map((r) => { const o = { ...r }; keys.forEach((k) => { o[k + '_no'] = !r[k]; }); return o; });\n  }\n  renderVals() {\n    // Fill in v (e.g. '₹ 100' or '₹ 15,000 – 20,000') when the hospital confirms each cost.\n    return { costs: this.fill([\n      { t: 'OPD registration and consultation', v: '', n: 'Per visit' },\n      { t: 'Normal delivery package', v: '', n: 'Includes stay; complications extra' },\n      { t: 'Caesarean delivery package', v: '', n: 'Includes stay; complications extra' },\n      { t: 'Complete blood count (CBC)', v: '', n: 'Laboratory' },\n      { t: 'Blood sugar', v: '', n: 'Laboratory' },\n      { t: 'Urine routine', v: '', n: 'Laboratory' },\n      { t: 'Chest X-ray', v: '', n: 'Radiology' },\n      { t: 'ECG', v: '', n: 'Diagnostics' }\n    ], ['v']) };\n  }\n}\n","props":{"$preview":{"width":1440,"height":5200}}}}};</script>
