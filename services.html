<script>window.__DC={"entry":"Services.dc.html","files":{"Services.dc.html":{"tpl":"\n\u003cdiv class=\"page\" style=\"font-family: 'Satoshi', system-ui, sans-serif; color: #0D1410; background: #FFFFFF\">\n\u003cdc-import name=\"Nav\" current=\"services\" hint-size=\"100%,112px\">\u003c/dc-import>\n\u003csection class=\"wrap hero\" style=\"padding-top: 24px\">\n\u003cdiv style=\"background: #F3F8F2; border-radius: 32px; padding: 12px; display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px\">\n\u003cdiv style=\"flex: 1.5 1 480px; min-width: 0; padding: clamp(28px, 4.5vw, 64px); box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 22px\">\n\u003cspan class=\"up\" style=\"font-size: 14px; color: #5E5E5E; animation-delay: .05s\">\u003ca href=\"/\" style=\"color: #5E5E5E; text-decoration: none\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> Services\u003c/span>\n\u003cspan class=\"eyebrow up\" style=\"align-self: flex-start; animation-delay: .12s\">Clinical services\u003c/span>\n\u003ch1 class=\"h1\" style=\"font-size: clamp(38px, 4.2vw, 58px); max-width: 620px\">\u003cspan class=\"hw\" style=\"animation-delay: 0.20s\">Comprehensive\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.28s\">and\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.36s\">compassionate\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.44s\">healthcare\u003c/span>\u003c/h1>\n\u003cp class=\"lead up\" style=\"max-width: 500px; animation-delay: .65s\">Quality healthcare at an affordable cost, with emphasis on the poor and marginalized, patient-centred care, safety, dignity and ethical medical practice.\u003c/p>\n\u003cdiv class=\"up\" style=\"display: flex; flex-wrap: wrap; gap: 12px; animation-delay: .8s\">\u003ca href=\"#departments\" style=\"display: inline-flex; align-items: center; min-height: 44px; padding: 10px 22px; box-sizing: border-box; border-radius: 80px; background: #1D7A3E; color: #FFFFFF; text-decoration: none; font-weight: 500\">Our departments\u003c/a>\u003ca href=\"tel:07682244311\" style=\"display: inline-flex; align-items: center; min-height: 44px; padding: 10px 22px; box-sizing: border-box; border-radius: 80px; background: #FFFFFF; color: #0D1410; text-decoration: none; font-weight: 500\">Emergency 07682-244311\u003c/a>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"reveal\" style=\"flex: 1 1 360px; min-width: 0; min-height: 440px; position: relative; border-radius: 24px; overflow: hidden; animation-delay: .1s\">\n\u003cimg class=\"kb\" src=\"/assets/eye-exam.webp\" alt=\"A doctor examining a patient\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\">\n\u003cdiv class=\"pop\" style=\"animation-delay: 1s; position: absolute; left: 16px; bottom: 16px; background: #FFFFFF; border-radius: 20px; padding: 14px 18px; display: flex; align-items: baseline; gap: 10px; box-shadow: 0 12px 30px rgba(14,27,19,.14)\">\u003cspan style=\"font-weight: 600; font-size: 30px; letter-spacing: -0.03em; line-height: 1\">100\u003c/span>\u003cspan style=\"font-size: 14px; color: #5E5E5E\">bed hospital\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection id=\"departments\" style=\"background: #F7FAF6\">\n\u003cdiv class=\"wrap sec\">\n\u003cdiv class=\"head\">\n\u003cspan class=\"eyebrow\">Clinical departments\u003c/span>\n\u003ch2 class=\"h2\">\u003cspan class=\"w\" style=\"animation-range: entry 0% entry 70%\">Specialist\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 4% entry 74%\">care\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 8% entry 78%\">for\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 12% entry 82%\">the\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 16% entry 86%\">whole\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 20% entry 90%\">family\u003c/span>\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px\">\n\u003cdiv style=\"background: #FFFFFF; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 220px; box-sizing: border-box\">\u003cspan style=\"display: flex; flex-direction: column; gap: 10px\">\u003cspan class=\"h3\">Obstetrics &amp; Gynaecology\u003c/span>\u003cspan style=\"font-size: 16px; line-height: 1.55; color: #5E5E5E\">Care for women from pregnancy through delivery and beyond.\u003c/span>\u003c/span>\u003cspan style=\"display: flex; flex-wrap: wrap; gap: 6px\">\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">Antenatal care\u003c/span>\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">Labour room\u003c/span>\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">Postnatal ward\u003c/span>\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">Newborn care\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 220px; box-sizing: border-box\">\u003cspan style=\"display: flex; flex-direction: column; gap: 10px\">\u003cspan class=\"h3\">Paediatrics\u003c/span>\u003cspan style=\"font-size: 16px; line-height: 1.55; color: #5E5E5E\">Specialised care for newborns, children and adolescents.\u003c/span>\u003c/span>\u003cspan style=\"display: flex; flex-wrap: wrap; gap: 6px\">\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">Paediatric OPD &amp; ward\u003c/span>\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">NICU\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 220px; box-sizing: border-box\">\u003cspan style=\"display: flex; flex-direction: column; gap: 10px\">\u003cspan class=\"h3\">General Medicine\u003c/span>\u003cspan style=\"font-size: 16px; line-height: 1.55; color: #5E5E5E\">Diagnosis and treatment for a wide range of conditions.\u003c/span>\u003c/span>\u003cspan style=\"display: flex; flex-wrap: wrap; gap: 6px\">\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">Check-ups\u003c/span>\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">Chronic disease care\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 220px; box-sizing: border-box\">\u003cspan style=\"display: flex; flex-direction: column; gap: 10px\">\u003cspan class=\"h3\">General Surgery\u003c/span>\u003cspan style=\"font-size: 16px; line-height: 1.55; color: #5E5E5E\">Planned and emergency surgery in our operation theatre.\u003c/span>\u003c/span>\u003cspan style=\"display: flex; flex-wrap: wrap; gap: 6px\">\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">Operation theatre\u003c/span>\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">Pre- &amp; post-operative care\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 220px; box-sizing: border-box\">\u003cspan style=\"display: flex; flex-direction: column; gap: 10px\">\u003cspan class=\"h3\">Anaesthesia\u003c/span>\u003cspan style=\"font-size: 16px; line-height: 1.55; color: #5E5E5E\">Safe anaesthesia for surgery and support for critical care.\u003c/span>\u003c/span>\u003cspan style=\"display: flex; flex-wrap: wrap; gap: 6px\">\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">Surgical anaesthesia\u003c/span>\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">ICU support\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 220px; box-sizing: border-box\">\u003cspan style=\"display: flex; flex-direction: column; gap: 10px\">\u003cspan class=\"h3\">Psychiatry &amp; Mental Health\u003c/span>\u003cspan style=\"font-size: 16px; line-height: 1.55; color: #5E5E5E\">Psychiatric OPD and inpatient services, with counselling.\u003c/span>\u003c/span>\u003cspan style=\"display: flex; flex-wrap: wrap; gap: 6px\">\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">Psychiatric OPD/IPD\u003c/span>\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">Counseling\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 220px; box-sizing: border-box\">\u003cspan style=\"display: flex; flex-direction: column; gap: 10px\">\u003cspan class=\"h3\">Dental\u003c/span>\u003cspan style=\"font-size: 16px; line-height: 1.55; color: #5E5E5E\">Routine and preventive dental care.\u003c/span>\u003c/span>\u003cspan style=\"display: flex; flex-wrap: wrap; gap: 6px\">\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">Check-ups\u003c/span>\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">Treatment\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; min-height: 220px; box-sizing: border-box\">\u003cspan style=\"display: flex; flex-direction: column; gap: 10px\">\u003cspan class=\"h3\">Emergency &amp; Casualty\u003c/span>\u003cspan style=\"font-size: 16px; line-height: 1.55; color: #5E5E5E\">24-hour emergency and casualty services, with ambulance.\u003c/span>\u003c/span>\u003cspan style=\"display: flex; flex-wrap: wrap; gap: 6px\">\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">24 hours\u003c/span>\u003cspan style=\"background: #F3F8F2; color: #1D5C34; font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 80px\">Ambulance\u003c/span>\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap sec\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 40px 80px\">\n\u003cdiv style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px; align-self: flex-start\">\n\u003cspan class=\"eyebrow\" style=\"align-self: flex-start\">Major clinical services\u003c/span>\n\u003ch2 class=\"h2\">\u003cspan class=\"w\" style=\"animation-range: entry 0% entry 70%\">All\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 4% entry 74%\">services\u003c/span>\u003c/h2>\n\u003cp class=\"lead\">The hospital provides services through various clinical and diagnostic departments.\u003c/p>\n\u003c/div>\n\u003cdiv style=\"flex: 2 1 560px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); column-gap: 40px\">\n\u003csc-for list=\"{{clinical}}\" as=\"c\" hint-placeholder-count=\"18\">\u003cspan class=\"item\">{{c}}\u003c/span>\u003c/sc-for>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection id=\"diagnostics\" style=\"background: #F7FAF6\">\n\u003cdiv class=\"wrap sec\">\n\u003cdiv class=\"head\">\n\u003cspan class=\"eyebrow\">Diagnostic facilities\u003c/span>\n\u003ch2 class=\"h2\">\u003cspan class=\"w\" style=\"animation-range: entry 0% entry 70%\">Timely\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 4% entry 74%\">investigation,\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 8% entry 78%\">diagnosis\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 12% entry 82%\">and\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 16% entry 86%\">treatment\u003c/span>\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px\">\n\u003csc-for list=\"{{diag}}\" as=\"d\" hint-placeholder-count=\"7\">\n\u003cdiv style=\"background: #FFFFFF; border-radius: 24px; padding: 28px; min-height: 150px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 28px\">\u003cspan style=\"font-size: 14px; color: #9AA59E\">{{d.k}}\u003c/span>\u003cspan class=\"h3\" style=\"font-size: 20px\">{{d.t}}\u003c/span>\u003c/div>\n\u003c/sc-for>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection id=\"palliative\" class=\"wrap sec\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 48px 80px; align-items: center\">\n\u003cimg src=\"/assets/palliative-patient.webp\" alt=\"A patient in a wheelchair with his family\" style=\"flex: 1 1 460px; min-width: 0; width: 100%; aspect-ratio: 5 / 4; object-fit: cover; border-radius: 32px\">\n\u003cdiv style=\"flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n\u003cspan class=\"eyebrow\" style=\"align-self: flex-start\">Palliative &amp; supportive care\u003c/span>\n\u003ch2 class=\"h2\">\u003cspan class=\"w\" style=\"animation-range: entry 0% entry 70%\">Holistic,\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 4% entry 74%\">compassionate\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 8% entry 78%\">and\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 12% entry 82%\">dignified\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 16% entry 86%\">patient\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 20% entry 90%\">care\u003c/span>\u003c/h2>\n\u003cp class=\"lead\">Palliative nursing care, counselling and mental health support, with palliative care services being developed further during 2025–26.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection style=\"background: #F7FAF6\">\n\u003cdiv class=\"wrap sec\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 40px 80px\">\n\u003cdiv style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px; align-self: flex-start\">\n\u003cspan class=\"eyebrow\" style=\"align-self: flex-start\">Support facilities\u003c/span>\n\u003ch2 class=\"h2\">\u003cspan class=\"w\" style=\"animation-range: entry 0% entry 70%\">Systems\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 4% entry 74%\">behind\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 8% entry 78%\">safe,\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 12% entry 82%\">efficient\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 16% entry 86%\">care\u003c/span>\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"flex: 2 1 560px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); column-gap: 40px\">\n\u003csc-for list=\"{{support}}\" as=\"s\" hint-placeholder-count=\"10\">\u003cspan class=\"item\">{{s}}\u003c/span>\u003c/sc-for>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap sec\">\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px\">\n\u003cdiv style=\"background: #F3F8F2; border-radius: 32px; padding: clamp(32px, 4vw, 48px); display: flex; flex-direction: column; gap: 32px\">\n\u003cspan style=\"font-size: 15px; color: #1D7A3E\">Quality and patient safety\u003c/span>\n\u003cp style=\"margin: 0; font-weight: 500; font-size: 22px; line-height: 1.45; letter-spacing: -0.015em\">The hospital continues to work towards maintaining quality standards through systematic processes related to infection prevention and control, biomedical waste management, patient safety, documentation and continuous quality improvement.\u003c/p>\n\u003c/div>\n\u003cdiv style=\"background: #F3F8F2; border-radius: 32px; padding: clamp(32px, 4vw, 48px); display: flex; flex-direction: column; gap: 32px\">\n\u003cspan style=\"font-size: 15px; color: #1D7A3E\">Digital and operational improvements\u003c/span>\n\u003cp style=\"margin: 0; font-weight: 500; font-size: 22px; line-height: 1.45; letter-spacing: -0.015em\">The hospital has introduced and strengthened digital systems for attendance, maintenance requests, asset management and other administrative processes to improve operational efficiency and accountability.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 16px\">\n\u003cdiv style=\"background: #0F3D22; color: #FFFFFF; border-radius: 32px; padding: clamp(32px, 4vw, 48px); display: flex; flex-direction: column; justify-content: space-between; gap: 40px\">\n\u003cspan style=\"font-size: 15px; color: #A9C7B0\">OPD timings\u003c/span>\n\u003cspan style=\"font-size: 18px; line-height: 1.8\">Monday to Friday · \u003cb style=\"font-weight: 600\">08:00 am – 2:30 pm\u003c/b>\u003cbr>Saturday · \u003cb style=\"font-weight: 600\">08:00 am – 11:30 am\u003c/b>\u003c/span>\n\u003c/div>\n\u003cdiv style=\"background: #FDEEEE; border-radius: 32px; padding: clamp(32px, 4vw, 48px); display: flex; flex-direction: column; justify-content: space-between; gap: 40px\">\n\u003cspan style=\"font-size: 15px; color: #A61B1B\">Emergency services\u003c/span>\n\u003cspan style=\"font-size: 17px; line-height: 1.6; color: #3A1F1F\">24-hour Emergency and Casualty Services for patients requiring urgent medical attention.\u003cbr>\u003ca href=\"tel:07682244311\" style=\"font-size: 30px; font-weight: 500; letter-spacing: -0.02em; color: #A61B1B; text-decoration: none\">07682-244311\u003c/a>\u003c/span>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003cdc-import name=\"Footer\" hint-size=\"100%,460px\">\u003c/dc-import>\n\u003c/div>\n","script":"\nclass Component extends DCLogic {\n  componentDidMount() { requestAnimationFrame(() => setTimeout(() => this.__rv(), 30)); }\n  componentWillUnmount() { if (this.__io) this.__io.disconnect(); }\n  __rv() {\n    try {\n      if (typeof window === 'undefined' || !('IntersectionObserver' in window)) return;\n      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n      const root = document.querySelector('.page');\n      if (!root) return;\n      const sel = 'section:not(.hero) :is(.tag,.eyebrow,h2,h3,p,li,img,.btn,figure,blockquote,form,[data-a],[style*=\"grid-template-columns\"] > *)';\n      const all = Array.from(root.querySelectorAll(sel));\n      const els = all.filter((el) => !all.some((o) => o !== el && o.contains(el)));\n      const counts = new Map();\n      els.forEach((el) => {\n        const p = el.parentElement;\n        const i = counts.get(p) || 0;\n        counts.set(p, i + 1);\n        el.setAttribute('data-a', '');\n        if (i) el.style.transitionDelay = Math.min(i * 90, 450) + 'ms';\n      });\n      document.documentElement.setAttribute('data-anim', 'on');\n      this.__io = new IntersectionObserver((entries) => {\n        entries.forEach((en) => {\n          if (en.isIntersecting) { en.target.setAttribute('data-in', ''); this.__io.unobserve(en.target); }\n        });\n      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n      els.forEach((el) => this.__io.observe(el));\n    } catch (e) {}\n  }\n  renderVals() {\n    return { fontName: (this.props.font ?? 'Work Sans'), fontStack: \"'\" + (this.props.font ?? 'Work Sans') + \"', system-ui, sans-serif\", \n      clinical: ['Obstetrics & Gynaecology', 'Paediatrics', 'Anaesthesia', 'General Medicine', 'General Surgery', 'Dental', 'Psychiatry', 'Counseling', 'Emergency and Casualty Services', 'Outpatient Department (OPD)', 'Inpatient Department (IPD)', 'Nursing Services', 'Laboratory and Diagnostic Services', 'Pharmacy Services', 'Physiotherapy and Allied Health Services', 'Health Camps and Community Outreach Services', 'Palliative Care Services', 'Mental Health'],\n      diag: ['Clinical Laboratory Services', 'Haematology and Biochemistry investigations', 'Microbiology and Serology investigations', 'Radiology and Imaging Services', 'X-Ray', 'ECG and other routine diagnostic investigations', 'Other diagnostic services as available'].map((t, i) => ({ t, k: String(i + 1).padStart(2, '0') })),\n      support: ['24-hour Emergency Services', '24-hour water supply and essential utility support', 'Hospital Pharmacy', 'Ambulance/Patient Transport Services', 'Central Sterile Supply and infection-control systems', 'Biomedical Waste Management system', 'Sewage Treatment Plant (STP)', 'Maintenance and engineering support', 'Patient and visitor support services', 'Online maintenance and asset-management systems']\n    };\n  }\n}\n","props":{"$preview":{"width":1440,"height":4300}}}}};</script>
