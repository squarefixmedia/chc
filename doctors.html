<script>window.__DC={"entry":"Doctors.dc.html","files":{"Doctors.dc.html":{"tpl":"\n\u003cdiv class=\"page\" lang=\"en\" style=\"font-family: 'Satoshi', 'Poppins', system-ui, sans-serif; color: #0D1410; background: #FFFFFF\">\n\u003cdc-import name=\"Nav\" current=\"patients\" hint-size=\"100%,112px\">\u003c/dc-import>\n\u003csection class=\"wrap hero\" style=\"padding-top: 24px\">\n\u003cdiv style=\"background: #F3F8F2; border-radius: 32px; padding: 12px; display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px\">\n\u003cdiv style=\"flex: 1.5 1 480px; min-width: 0; padding: clamp(28px, 4.5vw, 64px); box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 22px\">\n\u003cspan class=\"up\" style=\"font-size: 14px; color: #5E5E5E; animation-delay: .05s\">\u003ca href=\"/\" style=\"color: #5E5E5E; text-decoration: none\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> Doctors &amp; OPD schedule\u003c/span>\n\u003cspan class=\"eyebrow up\" style=\"align-self: flex-start; animation-delay: .12s\">Find a doctor\u003c/span>\n\u003ch1 class=\"h1\" style=\"font-size: clamp(38px, 4.2vw, 58px); max-width: 640px\">\u003cspan class=\"hw\" style=\"animation-delay: 0.20s\">Doctors\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.28s\">and\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.36s\">OPD\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.44s\">schedule\u003c/span>\u003c/h1>\n\u003cp class=\"lead up\" style=\"max-width: 520px; animation-delay: .65s\">Our consultants by department, with the days they see patients in the OPD.\u003c/p>\n\u003cdiv class=\"up\" style=\"display: flex; flex-wrap: wrap; gap: 12px; animation-delay: .8s\">\u003ca class=\"btn btn-p\" href=\"/patients\">Plan your visit\u003c/a>\u003ca class=\"btn\" href=\"tel:07682244311\" style=\"background: #B71C1C; color: #FFFFFF\">Emergency 07682-244311\u003c/a>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"reveal\" style=\"flex: 1 1 360px; min-width: 0; min-height: 420px; position: relative; border-radius: 24px; overflow: hidden; animation-delay: .1s\">\n\u003cimg class=\"kb\" src=\"/assets/clinic-exam.webp\" alt=\"Doctors examining a patient in the OPD\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\">\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap sec\">\n\u003cdiv style=\"background: #F3F8F2; border-radius: 28px; padding: 26px 30px; display: flex; flex-wrap: wrap; gap: 12px 40px; align-items: center; margin-bottom: 40px\">\n\u003cspan style=\"font-size: 18px; letter-spacing: -0.02em\">General OPD\u003c/span>\n\u003cspan class=\"muted\">Monday – Friday 8:00 am – 2:30 pm · Saturday 8:00 am – 11:30 am · Sundays and holidays: emergency only\u003c/span>\n\u003c/div>\n\u003cdiv role=\"tablist\" aria-label=\"Departments\" style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px\">\n\u003csc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"9\">\u003cbutton type=\"button\" role=\"tab\" aria-selected=\"{{t.sel}}\" onClick=\"{{t.pick}}\" style=\"{{t.css}}\">{{t.t}}\u003c/button>\u003c/sc-for>\n\u003c/div>\n\u003cdiv class=\"tblwrap\">\u003cdiv class=\"trow th\" style=\"grid-template-columns: 1.2fr 1.2fr 1fr 1fr\">\u003cspan>Department\u003c/span>\u003cspan>Consultant\u003c/span>\u003cspan>OPD days\u003c/span>\u003cspan>Timing\u003c/span>\u003c/div>\n\u003csc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"8\">\u003cdiv class=\"trow\" style=\"grid-template-columns: 1.2fr 1.2fr 1fr 1fr\">\u003cspan>{{r.dept}}\u003c/span>\u003cspan>\u003csc-if value=\"{{r.doc}}\" hint-placeholder-val=\"{{ true }}\">\u003cspan>{{r.doc}}\u003c/span>\u003c/sc-if>\u003csc-if value=\"{{r.doc_no}}\" hint-placeholder-val=\"{{ false }}\">\u003cspan class=\"tbc\">Name to be confirmed\u003c/span>\u003c/sc-if>\u003c/span>\u003cspan>\u003csc-if value=\"{{r.days}}\" hint-placeholder-val=\"{{ true }}\">\u003cspan>{{r.days}}\u003c/span>\u003c/sc-if>\u003csc-if value=\"{{r.days_no}}\" hint-placeholder-val=\"{{ false }}\">\u003cspan class=\"tbc\">To be confirmed\u003c/span>\u003c/sc-if>\u003c/span>\u003cspan>\u003csc-if value=\"{{r.time}}\" hint-placeholder-val=\"{{ true }}\">\u003cspan>{{r.time}}\u003c/span>\u003c/sc-if>\u003csc-if value=\"{{r.time_no}}\" hint-placeholder-val=\"{{ false }}\">\u003cspan class=\"tbc\">To be confirmed\u003c/span>\u003c/sc-if>\u003c/span>\u003c/div>\u003c/sc-for>\n\u003c/div>\n\u003cp class=\"muted\" style=\"margin-top: 18px\">Schedules can change. Please call before travelling for a specialist consultation.\u003c/p>\n\u003c/section>\n\u003cdc-import name=\"Footer\" hint-size=\"100%,460px\">\u003c/dc-import>\n\u003c/div>\n","script":"\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._t = setInterval(() => this.forceUpdate(), 60000);\n    requestAnimationFrame(() => setTimeout(() => this.__rv(), 30));\n  }\n  componentWillUnmount() { clearInterval(this._t); if (this.__io) this.__io.disconnect(); }\n  __rv() {\n    try {\n      if (typeof window === 'undefined' || !('IntersectionObserver' in window)) return;\n      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n      const root = document.querySelector('.page');\n      if (!root) return;\n      const sel = 'section:not(.hero) :is(.tag,.eyebrow,h2,h3,p,li,img,.btn,figure,blockquote,form,[data-a],[style*=\"grid-template-columns\"] > *)';\n      const all = Array.from(root.querySelectorAll(sel));\n      const els = all.filter((el) => !all.some((o) => o !== el && o.contains(el)));\n      const counts = new Map();\n      els.forEach((el) => {\n        const p = el.parentElement;\n        const i = counts.get(p) || 0;\n        counts.set(p, i + 1);\n        el.setAttribute('data-a', '');\n        if (i) el.style.transitionDelay = Math.min(i * 90, 450) + 'ms';\n      });\n      document.documentElement.setAttribute('data-anim', 'on');\n      this.__io = new IntersectionObserver((entries) => {\n        entries.forEach((en) => {\n          if (en.isIntersecting) { en.target.setAttribute('data-in', ''); this.__io.unobserve(en.target); }\n        });\n      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n      els.forEach((el) => this.__io.observe(el));\n    } catch (e) {}\n  }\n  opd() {\n    // OPD closed on Sundays and on these holidays (emergency stays open). Edit as the hospital announces closures.\n    // 'MM-DD' repeats every year; 'YYYY-MM-DD' is a one-off date.\n    const HOLIDAYS = ['01-26', '08-15', '10-02', '12-25'];\n    const now = new Date();\n    const ist = new Date(now.getTime() + (330 + now.getTimezoneOffset()) * 60000);\n    const p2 = (n) => String(n).padStart(2, '0');\n    const md = (dt) => p2(dt.getMonth() + 1) + '-' + p2(dt.getDate());\n    const isHol = (dt) => HOLIDAYS.includes(md(dt)) || HOLIDAYS.includes(dt.getFullYear() + '-' + md(dt));\n    const hours = (dt) => (dt.getDay() === 0 || isHol(dt)) ? null : (dt.getDay() === 6 ? [8, 11.5, '11:30 am'] : [8, 14.5, '2:30 pm']);\n    const h = ist.getHours() + ist.getMinutes() / 60;\n    const today = hours(ist);\n    if (today && h >= today[0] && h \u003c today[1]) return { open: true, t: 'OPD open now', s: 'Until ' + today[2] + ' today', nav: 'OPD open now · until ' + today[2], line: 'OPD open now · Emergency open 24 hours' };\n    if (today && h \u003c today[0]) return { open: false, t: 'OPD opens at 8:00 am', s: 'Emergency is open now', nav: 'OPD opens today at 8:00 am', line: 'OPD opens at 8:00 am · Emergency open 24 hours' };\n    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];\n    let next = 'soon';\n    for (let i = 1; i \u003c 14; i++) { const dt = new Date(ist.getTime() + i * 86400000); if (hours(dt)) { next = i === 1 ? 'tomorrow' : days[dt.getDay()]; break; } }\n    const hol = isHol(ist);\n    return {\n      open: false,\n      t: hol ? 'OPD closed today · holiday' : 'OPD opens ' + next,\n      s: hol ? 'Opens ' + next + ' · Emergency open' : 'Emergency is open now',\n      nav: (hol ? 'OPD closed today (holiday) · opens ' : 'OPD opens ') + next + ' at 8:00 am',\n      line: (hol ? 'OPD closed today (holiday) · opens ' : 'OPD opens ') + next + ' 8:00 am · Emergency open 24 hours'\n    };\n  }\n\n  fill(rows, keys) {\n    return rows.map((r) => { const o = { ...r }; keys.forEach((k) => { o[k + '_no'] = !r[k]; }); return o; });\n  }\n  renderVals() {\n    // Add each consultant as a row: { dept, doc: 'Dr. Name, MBBS, MS', days: 'Mon, Wed, Fri', time: '9:00 am – 1:00 pm' }.\n    const all = [\n      { dept: 'Obstetrics & Gynaecology', doc: '', days: '', time: '' },\n      { dept: 'Paediatrics & NICU', doc: '', days: '', time: '' },\n      { dept: 'General Medicine', doc: '', days: '', time: '' },\n      { dept: 'General Surgery', doc: '', days: '', time: '' },\n      { dept: 'Anaesthesia', doc: '', days: '', time: '' },\n      { dept: 'Psychiatry', doc: '', days: '', time: '' },\n      { dept: 'Dental', doc: '', days: '', time: '' },\n      { dept: 'Emergency & Casualty', doc: '', days: '24 hours, every day', time: '' }\n    ];\n    const dep = this.state.dep || 'All';\n    const names = ['All'].concat(all.map((r) => r.dept));\n    const css = (on) => 'min-height:44px;padding:0 18px;border-radius:80px;cursor:pointer;font-family:inherit;font-size:15px;border:1px solid ' + (on ? '#0D1410' : '#E6EBE5') + ';background:' + (on ? '#0D1410' : '#FFFFFF') + ';color:' + (on ? '#FFFFFF' : '#3E4A43');\n    return {\n      tabs: names.map((n) => ({ t: n, sel: n === dep ? 'true' : 'false', css: css(n === dep), pick: () => this.setState({ dep: n }) })),\n      rows: this.fill(all.filter((r) => dep === 'All' || r.dept === dep), ['doc', 'days', 'time'])\n    };\n  }\n}\n","props":{"$preview":{"width":1440,"height":2600}}}}};</script>
