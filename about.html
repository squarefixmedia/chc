<script>window.__DC={"entry":"About.dc.html","files":{"About.dc.html":{"tpl":"\n\u003cdiv class=\"page\" style=\"font-family: 'Satoshi', system-ui, sans-serif; color: #0D1410; background: #FFFFFF\">\n\u003cdc-import name=\"Nav\" current=\"about\" hint-size=\"100%,112px\">\u003c/dc-import>\n\u003csection class=\"wrap hero\" style=\"padding-top: 24px\">\n\u003cdiv style=\"background: #F3F8F2; border-radius: 32px; padding: 12px; display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px\">\n\u003cdiv style=\"flex: 1.5 1 480px; min-width: 0; padding: clamp(28px, 4.5vw, 64px); box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 22px\">\n\u003cspan class=\"up\" style=\"font-size: 14px; color: #5E5E5E; animation-delay: .05s\">\u003ca href=\"/\" style=\"color: #5E5E5E; text-decoration: none\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> About\u003c/span>\n\u003cspan class=\"eyebrow up\" style=\"align-self: flex-start; animation-delay: .12s\">About us\u003c/span>\n\u003ch1 class=\"h1\" style=\"font-size: clamp(38px, 4.2vw, 58px); max-width: 620px\">\u003cspan class=\"hw\" style=\"animation-delay: 0.20s\">Healing\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.28s\">communities,\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.36s\">transforming\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.44s\">lives\u003c/span>\u003c/h1>\n\u003cp class=\"lead up\" style=\"max-width: 500px; animation-delay: .65s\">For over nine decades, we’ve been bringing quality healthcare to those who need it most, one community at a time.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"reveal\" style=\"flex: 1 1 360px; min-width: 0; min-height: 440px; position: relative; border-radius: 24px; overflow: hidden; animation-delay: .1s\">\n\u003cimg class=\"kb\" src=\"/assets/entrance-gate.webp\" alt=\"The Christian Hospital entrance on Mahoba Road, Chhatarpur\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\">\n\u003cdiv class=\"pop\" style=\"animation-delay: 1s; position: absolute; left: 16px; bottom: 16px; background: #FFFFFF; border-radius: 20px; padding: 14px 18px; display: flex; align-items: baseline; gap: 10px; box-shadow: 0 12px 30px rgba(14,27,19,.14)\">\u003cspan style=\"font-weight: 600; font-size: 30px; letter-spacing: -0.03em; line-height: 1\">1930\u003c/span>\u003cspan style=\"font-size: 14px; color: #5E5E5E\">serving since\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap sec\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 32px 80px\">\n\u003cdiv style=\"flex: 1 1 240px; min-width: 0\">\u003cspan class=\"eyebrow\">Who we are\u003c/span>\u003c/div>\n\u003cdiv style=\"flex: 3 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n\u003cp style=\"margin: 0; font-weight: 500; font-size: clamp(24px, 2.4vw, 32px); line-height: 1.3; letter-spacing: -0.025em\">We are a nonprofit healthcare organization dedicated to ensuring that quality medical care is accessible to everyone, regardless of their economic circumstances.\u003c/p>\n\u003cp class=\"lead\" style=\"color: #2E3A33\">Christian Hospital Chhatarpur was founded in 1930 by missionaries of the Friends Foreign Missionary Society to serve the women and children of the Bundelkhand region. Today it is a 100 bed hospital and a unit of Emmanuel Hospital Association, New Delhi.\u003c/p>\n\u003cp class=\"lead\">Our team of compassionate healthcare professionals works tirelessly in underserved communities, providing essential services with dignity and respect. Founded on the belief that healthcare is a fundamental human right, we combine clinical excellence with community empowerment, creating sustainable health solutions that last beyond our visits.\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap\" style=\"padding-bottom: clamp(80px, 10vw, 140px)\">\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px\">\n\u003cdiv style=\"background: #0F3D22; color: #FFFFFF; border-radius: 32px; padding: clamp(32px, 4vw, 52px); display: flex; flex-direction: column; gap: 48px\">\u003cspan style=\"font-size: 15px; color: #A9C7B0\">Our vision\u003c/span>\u003cp style=\"margin: 0; font-weight: 500; font-size: clamp(22px, 2vw, 28px); line-height: 1.35; letter-spacing: -0.02em\">A world where every individual has access to compassionate, quality healthcare, and where communities are empowered to take control of their health and wellbeing.\u003c/p>\u003c/div>\n\u003cdiv style=\"background: #F3F8F2; border-radius: 32px; padding: clamp(32px, 4vw, 52px); display: flex; flex-direction: column; gap: 48px\">\u003cspan style=\"font-size: 15px; color: #1D7A3E\">Our mission\u003c/span>\u003cp style=\"margin: 0; font-weight: 500; font-size: clamp(22px, 2vw, 28px); line-height: 1.35; letter-spacing: -0.02em\">To deliver comprehensive healthcare services to underserved populations, build local capacity through education and training, and advocate for systemic changes that promote health equity for all.\u003c/p>\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection style=\"background: #F7FAF6\">\n\u003cdiv class=\"wrap sec\">\n\u003cdiv class=\"head\">\n\u003cspan class=\"eyebrow\">Our core values\u003c/span>\n\u003ch2 class=\"h2\">\u003cspan class=\"w\" style=\"animation-range: entry 0% entry 70%\">The\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 4% entry 74%\">principles\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 8% entry 78%\">that\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 12% entry 82%\">guide\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 16% entry 86%\">our\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 20% entry 90%\">work\u003c/span>\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px\">\n\u003csc-for list=\"{{values}}\" as=\"v\" hint-placeholder-count=\"6\">\n\u003cdiv style=\"background: #FFFFFF; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 40px\">\u003cspan style=\"font-size: 14px; color: #9AA59E\">{{v.n}}\u003c/span>\u003cspan style=\"display: flex; flex-direction: column; gap: 12px\">\u003cspan class=\"h3\">{{v.t}}\u003c/span>\u003cspan style=\"font-size: 16.5px; line-height: 1.6; color: #5E5E5E\">{{v.d}}\u003c/span>\u003c/span>\u003c/div>\n\u003c/sc-for>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap sec\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 48px 80px; align-items: flex-start\">\n\u003cfigure style=\"flex: 1 1 420px; min-width: 0; margin: 0; display: flex; flex-direction: column; gap: 14px\">\n\u003cimg class=\"archive\" src=\"/assets/founders-1925.webp\" alt=\"Ms. Esther Baird and Ms. Delia Fistler of the Friends Foreign Missionary Society, 1925\" style=\"width: 100%; aspect-ratio: 978 / 578; object-fit: cover; border-radius: 28px\">\n\u003cfigcaption style=\"font-size: 14px; color: #5E5E5E\">Ms. Esther Baird and Ms. Delia Fistler of the Friends Foreign Missionary Society (1925)\u003c/figcaption>\n\u003c/figure>\n\u003cdiv style=\"flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n\u003cspan class=\"eyebrow\" style=\"align-self: flex-start\">Our legacy\u003c/span>\n\u003cp class=\"lead\" style=\"color: #2E3A33\">Our story began in a small rural clinic, where a group of dedicated healthcare workers witnessed firsthand the devastating impact of inadequate medical access. What started as a weekend volunteer initiative has grown into a comprehensive healthcare network serving thousands of families across multiple regions.\u003c/p>\n\u003csc-if value=\"{{more}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cp class=\"lead\">In those early days, we operated out of borrowed spaces with limited supplies. But what we lacked in resources, we made up for in determination. We listened to mothers worried about their children’s persistent coughs, elders struggling with preventable chronic conditions, and young adults unable to access basic reproductive health services.\u003c/p>\n\u003cp class=\"lead\">These stories shaped our approach. We realized that sustainable healthcare requires more than temporary interventions. It demands long-term commitment, community partnership, and a willingness to address the social determinants that influence health outcomes. Today, our legacy is measured not just in the number of patients served, but in the communities empowered to advocate for their own health needs.\u003c/p>\n\u003c/sc-if>\n\u003cbutton type=\"button\" class=\"btn btn-o\" onClick=\"{{toggleMore}}\" aria-expanded=\"{{moreStr}}\" style=\"align-self: flex-start\">{{moreLabel}}\u003c/button>\n\u003c/div>\n\u003c/div>\n\u003cblockquote style=\"margin: clamp(64px, 7vw, 104px) auto 0; max-width: 900px; text-align: center; display: flex; flex-direction: column; gap: 20px\">\n\u003cp style=\"margin: 0; font-weight: 500; font-size: clamp(24px, 2.6vw, 36px); line-height: 1.3; letter-spacing: -0.025em\">“Every person deserves to live a healthy life. Our legacy is ensuring that access to quality healthcare is never determined by where you were born or how much money you have.”\u003c/p>\n\u003c/blockquote>\n\u003c/section>\n\u003csection id=\"history\" style=\"background: #F7FAF6\">\n\u003cdiv class=\"wrap sec\">\n\u003cdiv class=\"head\">\n\u003cspan class=\"eyebrow\">History\u003c/span>\n\u003ch2 class=\"h2\">\u003cspan class=\"w\" style=\"animation-range: entry 0% entry 70%\">Our\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 4% entry 74%\">journey\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 8% entry 78%\">since\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 12% entry 82%\">1925\u003c/span>\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display: flex; flex-direction: column\">\n\u003csc-for list=\"{{timeline}}\" as=\"t\" hint-placeholder-count=\"7\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 20px 48px; padding: 28px 0; border-top: 1px solid #E1E8DF\">\n\u003cspan style=\"font-weight: 600; flex: 0 0 180px; font-size: 40px; color: #1D7A3E; line-height: 1\">{{t.y}}\u003c/span>\n\u003cspan style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 8px\">\u003cspan class=\"h3\">{{t.t}}\u003c/span>\u003cspan style=\"font-size: 16.5px; line-height: 1.55; color: #5E5E5E\">{{t.d}}\u003c/span>\u003c/span>\n\u003csc-if value=\"{{t.hasImg}}\" hint-placeholder-val=\"{{ false }}\">\u003cimg class=\"archive\" src=\"{{t.img}}\" alt=\"{{t.alt}}\" style=\"flex: 0 0 200px; width: 200px; height: 130px; object-fit: cover; border-radius: 18px\">\u003c/sc-if>\n\u003c/div>\n\u003c/sc-for>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap sec\">\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px\">\n\u003cdiv style=\"background: #F3F8F2; border-radius: 32px; padding: clamp(32px, 4vw, 48px); display: flex; flex-direction: column; justify-content: space-between; gap: 40px\">\n\u003cspan style=\"font-size: 15px; color: #1D7A3E\">Part of a fellowship\u003c/span>\n\u003cspan style=\"display: flex; flex-direction: column; gap: 14px\">\u003cspan class=\"h3\" style=\"font-size: 26px\">A unit of Emmanuel Hospital Association, New Delhi\u003c/span>\u003cspan style=\"font-size: 16.5px; line-height: 1.6; color: #5E5E5E\">A fellowship of 19 hospitals across 9 states of India.\u003c/span>\u003c/span>\n\u003ca href=\"https://www.ehahealth.org/\" style=\"font-weight: 500\">ehahealth.org ↗\u003c/a>\n\u003c/div>\n\u003cdiv style=\"background: #F3F8F2; border-radius: 32px; padding: clamp(32px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 28px; align-items: center\">\n\u003cimg src=\"/assets/nabh-entry-level.webp\" alt=\"NABH Entry Level pre-accredited badge\" style=\"width: 120px; height: auto\">\n\u003cspan style=\"flex: 1 1 200px; display: flex; flex-direction: column; gap: 10px\">\u003cspan class=\"h3\" style=\"font-size: 26px\">NABH Entry Level\u003c/span>\u003cspan style=\"font-size: 16.5px; line-height: 1.6; color: #5E5E5E\">Pre-accredited for patient safety and quality of care.\u003c/span>\u003c/span>\n\u003c/div>\n\u003c/div>\n\u003cdiv style=\"margin-top: clamp(64px, 7vw, 104px); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 24px\">\n\u003ch2 class=\"h2\" style=\"max-width: 720px\">\u003cspan class=\"w\" style=\"animation-range: entry 0% entry 70%\">Join\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 4% entry 74%\">us\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 8% entry 78%\">in\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 12% entry 82%\">our\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 16% entry 86%\">mission\u003c/span>\u003c/h2>\n\u003cp class=\"lead\" style=\"max-width: 600px\">Whether through volunteering, donating, or partnering with us, you can be part of the solution. Together, we can create healthier communities and brighter futures.\u003c/p>\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: center\">\u003ca class=\"btn btn-p\" href=\"/get-involved\">Get involved\u003c/a>\u003ca class=\"btn btn-o\" href=\"/contact\">Contact us\u003c/a>\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003cdc-import name=\"Footer\" hint-size=\"100%,460px\">\u003c/dc-import>\n\u003c/div>\n","script":"\nclass Component extends DCLogic {\n  componentDidMount() { requestAnimationFrame(() => setTimeout(() => this.__rv(), 30)); }\n  componentWillUnmount() { if (this.__io) this.__io.disconnect(); }\n  __rv() {\n    try {\n      if (typeof window === 'undefined' || !('IntersectionObserver' in window)) r
