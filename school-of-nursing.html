<script>window.__DC={"entry":"SchoolOfNursing.dc.html","files":{"SchoolOfNursing.dc.html":{"tpl":"\n\u003cdiv class=\"page\" style=\"font-family: 'Satoshi', system-ui, sans-serif; color: #0D1410; background: #FFFFFF\">\n\u003cdc-import name=\"Nav\" current=\"nursing\" hint-size=\"100%,112px\">\u003c/dc-import>\n\u003csection class=\"wrap hero\" style=\"padding-top: 24px\">\n\u003cdiv style=\"background: #F3F8F2; border-radius: 32px; padding: 12px; display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px\">\n\u003cdiv style=\"flex: 1.5 1 480px; min-width: 0; padding: clamp(28px, 4.5vw, 64px); box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 22px\">\n\u003cspan class=\"up\" style=\"font-size: 14px; color: #5E5E5E; animation-delay: .05s\">\u003ca href=\"/\" style=\"color: #5E5E5E; text-decoration: none\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> School of Nursing\u003c/span>\n\u003cspan class=\"eyebrow up\" style=\"align-self: flex-start; animation-delay: .12s\">Christian Hospital Chhatarpur School of Nursing\u003c/span>\n\u003ch1 class=\"h1\" style=\"font-size: clamp(38px, 4.2vw, 58px); max-width: 620px\">\u003cspan class=\"hw\" style=\"animation-delay: 0.20s\">General\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.28s\">Nursing\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.36s\">and\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.44s\">Midwifery\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.52s\">(GNM)\u003c/span>\u003c/h1>\n\u003cp class=\"lead up\" style=\"max-width: 500px; animation-delay: .65s\">3-year programme · Approved intake: 30 students · Affiliated to MPNRC, Bhopal\u003c/p>\n\u003cdiv class=\"up\" style=\"display: flex; flex-wrap: wrap; gap: 12px; animation-delay: .8s\">\u003ca href=\"#eligibility\" style=\"display: inline-flex; align-items: center; min-height: 44px; padding: 10px 22px; box-sizing: border-box; border-radius: 80px; background: #1D7A3E; color: #FFFFFF; text-decoration: none; font-weight: 500\">Check eligibility\u003c/a>\u003ca href=\"#contact\" style=\"display: inline-flex; align-items: center; min-height: 44px; padding: 10px 22px; box-sizing: border-box; border-radius: 80px; background: #FFFFFF; color: #0D1410; text-decoration: none; font-weight: 500\">Contact the Principal\u003c/a>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"reveal\" style=\"flex: 1 1 360px; min-width: 0; min-height: 440px; position: relative; border-radius: 24px; overflow: hidden; animation-delay: .1s\">\n\u003cimg class=\"kb\" src=\"/assets/nurses-documentation.webp\" alt=\"Two nurses writing up patient records\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\">\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap hero\" style=\"padding-top: 16px\">\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 0\">\n\u003cdiv style=\"background: #F3F8F2; border-radius: 24px; padding: 26px; display: flex; flex-direction: column; gap: 28px\">\u003cspan style=\"font-size: 14px; color: #5E5E5E\">Course offered\u003c/span>\u003cspan class=\"h3\" style=\"font-size: 20px\">General Nursing and Midwifery (GNM) – 3 years\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #F3F8F2; border-radius: 24px; padding: 26px; display: flex; flex-direction: column; gap: 28px\">\u003cspan style=\"font-size: 14px; color: #5E5E5E\">Approved intake\u003c/span>\u003cspan class=\"h3\" style=\"font-size: 20px\">30 students\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #F3F8F2; border-radius: 24px; padding: 26px; display: flex; flex-direction: column; gap: 28px\">\u003cspan style=\"font-size: 14px; color: #5E5E5E\">Affiliation\u003c/span>\u003cspan class=\"h3\" style=\"font-size: 20px\">Madhya Pradesh Nurses Registration Council (MPNRC), Bhopal\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #F3F8F2; border-radius: 24px; padding: 26px; display: flex; flex-direction: column; gap: 28px\">\u003cspan style=\"font-size: 14px; color: #5E5E5E\">Recognition\u003c/span>\u003cspan class=\"h3\" style=\"font-size: 20px\">Indian Nursing Council (INC) School Code: 1802039\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap sec\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 40px 80px\">\n\u003cdiv style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n\u003cspan class=\"eyebrow\" style=\"align-self: flex-start\">About the school\u003c/span>\n\u003ch2 class=\"h2\">\u003cspan class=\"w\" style=\"animation-range: entry 0% entry 70%\">Shaping\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 4% entry 74%\">competent,\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 8% entry 78%\">compassionate\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 12% entry 82%\">nurses\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 16% entry 86%\">since\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 20% entry 90%\">1975\u003c/span>\u003c/h2>\n\u003cp class=\"lead\">What began as an Auxiliary Nurse Midwife (ANM) programme evolved into the General Nursing and Midwifery (GNM) programme. Our approach balances theoretical knowledge with hands-on practical training, preparing nurses for rural clinics and modern hospitals alike.\u003c/p>\n\u003c/div>\n\u003cdiv style=\"flex: 1 1 420px; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: start\">\n\u003cdiv style=\"background: #F2EDF8; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\u003cspan class=\"h3\" style=\"font-size: 19px\">Service\u003c/span>\u003cspan style=\"font-size: 16px; line-height: 1.5; color: #4A4458\">Serving patients and communities with dedication and humility.\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #F2EDF8; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\u003cspan class=\"h3\" style=\"font-size: 19px\">Integrity\u003c/span>\u003cspan style=\"font-size: 16px; line-height: 1.5; color: #4A4458\">Upholding the highest ethical standards in nursing practice.\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #F2EDF8; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\u003cspan class=\"h3\" style=\"font-size: 19px\">Excellence\u003c/span>\u003cspan style=\"font-size: 16px; line-height: 1.5; color: #4A4458\">Continuous learning and the highest quality of care.\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #F2EDF8; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\u003cspan class=\"h3\" style=\"font-size: 19px\">Compassion\u003c/span>\u003cspan style=\"font-size: 16px; line-height: 1.5; color: #4A4458\">Treating every patient with empathy, dignity and respect.\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection id=\"eligibility\" class=\"wrap sec\" style=\"padding-top: 0\">\n\u003cdiv class=\"head\">\n\u003cspan class=\"eyebrow\">Basic admission eligibility\u003c/span>\n\u003ch2 class=\"h2\">\u003cspan class=\"w\" style=\"animation-range: entry 0% entry 70%\">Which\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 4% entry 74%\">route\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 8% entry 78%\">fits\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 12% entry 82%\">you?\u003c/span>\u003c/h2>\n\u003cp class=\"lead\">Select your qualification. All routes are subject to applicable regulatory requirements.\u003c/p>\n\u003c/div>\n\u003cdiv role=\"radiogroup\" aria-label=\"Your qualification\" style=\"display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 24px\">\n\u003csc-for list=\"{{routes}}\" as=\"r\" hint-placeholder-count=\"4\">\n\u003cbutton type=\"button\" role=\"radio\" aria-checked=\"{{r.sel}}\" onClick=\"{{r.pick}}\" style=\"{{r.btn}}\">{{r.t}}\u003c/button>\n\u003c/sc-for>\n\u003c/div>\n\u003cdiv style=\"max-width: 820px; margin: 0 auto; background: #F3F8F2; border-radius: 32px; padding: clamp(32px, 4vw, 48px); display: flex; flex-direction: column; gap: 20px; text-align: center; align-items: center\">\n\u003cspan style=\"font-size: 14px; color: #9AA59E\">{{cur.label}}\u003c/span>\n\u003cp style=\"margin: 0; font-weight: 500; font-size: clamp(22px, 2.2vw, 28px); line-height: 1.4; letter-spacing: -0.02em\">{{cur.text}}\u003c/p>\n\u003cspan style=\"font-size: 15px; color: #5E5E5E\">Next admission dates: [TO BE CONFIRMED]\u003c/span>\n\u003c/div>\n\u003c/section>\n\u003csection style=\"background: #F7FAF6\">\n\u003cdiv class=\"wrap sec\">\n\u003cdiv class=\"head\">\n\u003cspan class=\"eyebrow\">Learning environment\u003c/span>\n\u003ch2 class=\"h2\">\u003cspan class=\"w\" style=\"animation-range: entry 0% entry 70%\">Classroom,\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 4% entry 74%\">skills\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 8% entry 78%\">lab,\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 12% entry 82%\">then\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 16% entry 86%\">the\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 20% entry 90%\">wards\u003c/span>\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px\">\n\u003cdiv style=\"background: #FFFFFF; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 12px\">\u003cspan class=\"h3\">Teaching facilities\u003c/span>\u003cspan style=\"display: flex; flex-direction: column\">\u003csc-for list=\"{{teaching}}\" as=\"x\" hint-placeholder-count=\"7\">\u003cspan class=\"item\">{{x}}\u003c/span>\u003c/sc-for>\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 12px\">\u003cspan class=\"h3\">Clinical training facilities\u003c/span>\u003cspan style=\"display: flex; flex-direction: column\">\u003csc-for list=\"{{clinical}}\" as=\"x\" hint-placeholder-count=\"12\">\u003cspan class=\"item\">{{x}}\u003c/span>\u003c/sc-for>\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 12px\">\u003cspan class=\"h3\">Outside clinical postings &amp; field experiences\u003c/span>\u003cspan style=\"display: flex; flex-direction: column\">\u003csc-for list=\"{{outside}}\" as=\"x\" hint-placeholder-count=\"4\">\u003cspan class=\"item\">{{x}}\u003c/span>\u003c/sc-for>\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap\" style=\"padding-top: clamp(64px, 8vw, 112px)\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 32px 80px; align-items: flex-start\">\n\u003cdiv style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\u003cspan class=\"eyebrow\" style=\"align-self: flex-start\">Core subjects\u003c/span>\u003ch2 class=\"h2\" style=\"font-size: clamp(28px, 2.8vw, 38px)\">\u003cspan class=\"w\" style=\"animation-range: entry 0% entry 70%\">What\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 4% entry 74%\">you\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 8% entry 78%\">will\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 12% entry 82%\">study\u003c/span>\u003c/h2>\u003c/div>\n\u003cdiv class=\"rv\" style=\"flex: 2 1 520px; min-width: 0; display: flex; flex-wrap: wrap; gap: 8px\">\u003cspan style=\"background: #FFFFFF; border: 1px solid #E5DEEF; border-radius: 80px; padding: 10px 16px; font-size: 15px\">Anatomy &amp; Physiology\u003c/span>\u003cspan style=\"background: #FFFFFF; border: 1px solid #E5DEEF; border-radius: 80px; padding: 10px 16px; font-size: 15px\">Fundamentals of Nursing\u003c/span>\u003cspan style=\"background: #FFFFFF; border: 1px solid #E5DEEF; border-radius: 80px; padding: 10px 16px; font-size: 15px\">Medical-Surgical Nursing\u003c/span>\u003cspan style=\"background: #FFFFFF; border: 1px solid #E5DEEF; border-radius: 80px; padding: 10px 16px; font-size: 15px\">Child Health Nursing\u003c/span>\u003cspan style=\"background: #FFFFFF; border: 1px solid #E5DEEF; border-radius: 80px; padding: 10px 16px; font-size: 15px\">Midwifery &amp; Gynaecological Nursing\u003c/span>\u003cspan style=\"background: #FFFFFF; border: 1px solid #E5DEEF; border-radius: 80px; padding: 10px 16px; font-size: 15px\">Community Health Nursing\u003c/span>\u003cspan style=\"background: #FFFFFF; border: 1px solid #E5DEEF; border-radius: 80px; padding: 10px 16px; font-size: 15px\">Mental Health &amp; Psychiatric Nursing\u003c/span>\u003cspan style=\"background: #FFFFFF; border: 1px solid #E5DEEF; border-radius: 80px; padding: 10px 16px; font-size: 15px\">Nutrition &amp; Biochemistry\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap sec\">\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px\">\n\u003cdiv style=\"background: #0F3D22; color: #FFFFFF; border-radius: 32px; padding: clamp(32px, 4vw, 48px); display: flex; flex-direction: column; justify-content: space-between; gap: 48px\">\n\u003cspan style=\"font-size: 15px; color: #A9C7B0\">Achievement\u003c/span>\n\u003cspan style=\"display: flex; flex-direction: column; gap: 14px\">\u003cspan class=\"h3\" style=\"font-size: 26px; color: #FFFFFF\">Development and strengthening of Skills Laboratories\u003c/span>\u003cspan style=\"font-size: 16px; line-height: 1.65; color: #C9DCCD\">Developed and equipped dedicated skills laboratories to support hands-on training and competency-based nursing education, in accordance with applicable regulatory requirements.\u003c/span>\u003c/span>\n\u003c/div>\n\u003cdiv style=\"background: #F3F8F2; border-radius: 32px; padding: clamp(32px, 4vw, 48px); display: flex; flex-direction: column; justify-content: space-between; gap: 48px\">\n\u003cspan style=\"font-size: 15px; color: #1D7A3E\">Upcoming initiatives\u003c/span>\n\u003cspan style=\"display: flex; flex-direction: column; gap: 22px\">\n\u003cspan style=\"display: flex; flex-direction: column; gap: 8px\">\u003cspan class=\"h3\">Community Impact studies\u003c/span>\u003cspan style=\"font-size: 16.5px; line-height: 1.6; color: #5E5E5E\">On selected national health programmes.\u003c/span>\u003c/span>\n\u003cspan style=\"display: flex; flex-direction: column; gap: 8px\">\u003cspan class=\"h3\">Strengthening Simulation and Clinical Competency-Based Learning\u003c/span>\u003cspan style=\"font-size: 16.5px; line-height: 1.6; color: #5E5E5E\">To ensure that students develop confidence and competency before and during clinical practice.\u003c/span>\u003c/span>\n\u003c/span>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap sec\">\n\u003cdiv class=\"head\">\u003cspan class=\"eyebrow\">Fees, hostel &amp; support\u003c/span>\u003ch2 class=\"h2\">What studying here involves\u003c/h2>\u003cp class=\"lead\">Details for the 2026–27 batch will be published here with the admission notice.\u003c/p>\u003c/div>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px\">\n\u003cdiv style=\"background: #FFFFFF; border: 1px solid #E6EBE5; border-radius: 28px; padding: 30px; display: flex; flex-direction: column; gap: 12px\">\u003cspan class=\"h3\">Fees\u003c/span>\u003cspan style=\"font-size: 16.5px; line-height: 1.6; color: #5E5E5E\">Tuition, examination and other fees for the 3-year GNM programme.\u003c/span>\u003cspan style=\"display: flex; flex-wrap: wrap; gap: 8px\">\u003cspan class=\"tbc\">Fee structure to be confirmed\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border: 1px solid #E6EBE5; border-radius: 28px; padding: 30px; display: flex; flex-direction: column; gap: 12px\">\u003cspan class=\"h3\">Hostel\u003c/span>\u003cspan style=\"font-size: 16.5px; line-height: 1.6; color: #5E5E5E\">Accommodation and meals for students on campus.\u003c/span>\u003cspan style=\"display: flex; flex-wrap: wrap; gap: 8px\">\u003cspan class=\"tbc\">Hostel availability\u003c/span>\u003cspan class=\"tbc\">Hostel fees\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border: 1px solid #E6EBE5; border-radius: 28px; padding: 30px; display: flex; flex-direction: column; gap: 12px\">\u003cspan class=\"h3\">Scholarships\u003c/span>\u003cspan style=\"font-size: 16.5px; line-height: 1.6; color: #5E5E5E\">Financial support for eligible students.\u003c/span>\u003cspan style=\"display: flex; flex-wrap: wrap; gap: 8px\">\u003cspan class=\"tbc\">Scholarships available\u003c/span>\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border: 1px solid #E6EBE5; border-radius: 28px; padding: 30px; display: flex; flex-direction: column; gap: 12px\">\u003cspan class=\"h3\">Placements\u003c/span>\u003cspan style=\"font-size: 16.5px; line-height: 1.6; color: #5E5E5E\">Where our graduates go on to work.\u003c/span>\u003cspan style=\"display: flex; flex-wrap: wrap; gap: 8px\">\u003cspan class=\"tbc\">Placement record\u003c/span>\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap\" style=\"padding-bottom: clamp(48px, 4.4vw, 64px)\">\n\u003cdiv class=\"head\">\u003cspan class=\"eyebrow\">Where you will train\u003c/span>\u003ch2 class=\"h2\">Learning on real wards\u003c/h2>\u003cp class=\"lead\">Students train across the hospital's wards and units. A gallery of student life will be added when photos are available.\u003c/p>\u003c/div>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px\">\u003cimg src=\"/assets/nicu-nurses.webp\" alt=\
