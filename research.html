<script>window.__DC={"entry":"Research.dc.html","files":{"Research.dc.html":{"tpl":"\n\u003cdiv class=\"page\" style=\"font-family: 'Satoshi', system-ui, sans-serif; color: #0D1410; background: #FFFFFF\">\n\u003cdc-import name=\"Nav\" current=\"more\" hint-size=\"100%,112px\">\u003c/dc-import>\n\u003csection class=\"wrap hero\" style=\"padding-top: 24px\">\n\u003cdiv style=\"background: #F3F8F2; border-radius: 32px; padding: 12px; display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px\">\n\u003cdiv style=\"flex: 1.5 1 480px; min-width: 0; padding: clamp(28px, 4.5vw, 64px); box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 22px\">\n\u003cspan class=\"up\" style=\"font-size: 14px; color: #5E5E5E; animation-delay: .05s\">\u003ca href=\"/\" style=\"color: #5E5E5E; text-decoration: none\">Home\u003c/a> \u003cspan aria-hidden=\"true\">/\u003c/span> Research\u003c/span>\n\u003cspan class=\"eyebrow up\" style=\"align-self: flex-start; animation-delay: .12s\">Research and learning\u003c/span>\n\u003ch1 class=\"h1\" style=\"font-size: clamp(38px, 4.2vw, 58px); max-width: 620px\">\u003cspan class=\"hw\" style=\"animation-delay: 0.20s\">Evidence\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.28s\">that\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.36s\">improves\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.44s\">patient\u003c/span> \u003cspan class=\"hw\" style=\"animation-delay: 0.52s\">care\u003c/span>\u003c/h1>\n\u003cp class=\"lead up\" style=\"max-width: 500px; animation-delay: .65s\">The hospital encourages research and evidence-based practice to improve patient care, clinical outcomes and community health.\u003c/p>\n\u003c/div>\n\u003cdiv class=\"reveal\" style=\"flex: 1 1 360px; min-width: 0; min-height: 440px; position: relative; border-radius: 24px; overflow: hidden; animation-delay: .1s\">\n\u003cimg class=\"kb\" src=\"/assets/labour-room-newborn.webp\" alt=\"A nurse with a newborn in the labour room\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover\">\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap\" style=\"padding-top: clamp(72px, 9vw, 120px)\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px\">\u003cspan class=\"eyebrow\">Research studies completed during 2025–26\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #F3F8F2; border-radius: 32px; padding: clamp(28px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 32px 64px\">\n\u003cdiv style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n\u003cspan style=\"font-size: 14px; color: #5E5E5E\">01 · Obstetrics &amp; Gynecology\u003c/span>\n\u003cspan class=\"h2\" style=\"font-size: clamp(28px, 2.8vw, 38px)\">Clinical Challenges in Labor &amp; Delivery\u003c/span>\n\u003c/div>\n\u003cdiv style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 12px; justify-content: flex-end\">\n\u003cspan style=\"font-size: 14px; color: #5E5E5E\">Purpose / key findings\u003c/span>\n\u003cspan style=\"font-size: 17px; line-height: 1.6\">Placenta previa/accreta is defined as the implantation of the gestational … \u003cspan style=\"background: #FFF3D6; color: #8A5A00; font-size: 14px; font-weight: 600; padding: 3px 8px; border-radius: 6px\">[Full text to come]\u003c/span>\u003c/span>\n\u003c/div>\n\u003c/div>\n\u003cp class=\"lead\" style=\"max-width: 820px; margin-top: 40px\">The hospital encourages clinical teams and staff to participate in research, professional development, quality-improvement initiatives and evidence-based healthcare practices. Research findings are used, where appropriate, to strengthen clinical protocols, patient care and community health interventions.\u003c/p>\n\u003c/section>\n\u003csection class=\"wrap sec\">\n\u003cdiv style=\"background: #0F3D22; color: #FFFFFF; border-radius: 32px; padding: clamp(36px, 5vw, 64px); display: flex; flex-wrap: wrap; gap: 40px 72px\">\n\u003cdiv style=\"flex: 1.3 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 22px\">\n\u003cspan style=\"align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #CFE6D4; background: rgba(255,255,255,.08); padding: 9px 14px; border-radius: 80px\">\u003cspan style=\"width: 6px; height: 6px; border-radius: 50%; background: #F2C94C\">\u003c/span>Featured study\u003c/span>\n\u003ch2 class=\"h2\" style=\"color: #FFFFFF; font-size: clamp(28px, 3vw, 42px)\">\u003cspan class=\"w\" style=\"animation-range: entry 0% entry 70%\">Can\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 4% entry 74%\">Severe\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 8% entry 78%\">Acute\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 12% entry 82%\">Malnutrition\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 16% entry 86%\">(SAM)\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 20% entry 90%\">be\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 24% entry 94%\">successfully\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 28% entry 98%\">treated\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 32% entry 100%\">at\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 36% entry 100%\">the\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 40% entry 100%\">community\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 40% entry 100%\">level?\u003c/span>\u003c/h2>\n\u003cp style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #C9DCCD\">This study examines the effectiveness of community-based approaches to treating severe acute malnutrition in children, bringing nutrition education and rehabilitation directly to families in their communities.\u003c/p>\n\u003csc-if value=\"{{more}}\" hint-placeholder-val=\"{{ false }}\">\n\u003cp style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #C9DCCD\">The study employed a community-based intervention model, conducting intensive two-week nutrition education and rehabilitation sessions with caregivers of malnourished children in Chhatarpur district. Follow-up assessments measured changes in caregiver knowledge, child anthropometric indicators, and long-term health outcomes over six months.\u003c/p>\n\u003cp style=\"margin: 0; font-size: 17px; line-height: 1.65; color: #C9DCCD\">The community-based model proved cost-effective and culturally appropriate, with higher retention rates compared to facility-based programs, supporting the scalability of community-based malnutrition treatment in resource-limited settings.\u003c/p>\n\u003c/sc-if>\n\u003cbutton type=\"button\" onClick=\"{{toggle}}\" aria-expanded=\"{{moreStr}}\" class=\"btn\" style=\"align-self: flex-start; background: #FFFFFF; color: #0F3D22; border: 0\">{{moreLabel}}\u003c/button>\n\u003c/div>\n\u003cdiv style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px\">\n\u003cspan style=\"font-size: 14px; color: #A9C7B0\">Published in partnership with\u003c/span>\n\u003cspan class=\"h3\" style=\"color: #FFFFFF\">Azim Premji University Health Worker Platform\u003c/span>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection style=\"background: #F7FAF6\">\n\u003cdiv class=\"wrap sec\">\n\u003cdiv class=\"head\">\n\u003cspan class=\"eyebrow\">Research focus areas\u003c/span>\n\u003ch2 class=\"h2\">\u003cspan class=\"w\" style=\"animation-range: entry 0% entry 70%\">Where\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 4% entry 74%\">we\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 8% entry 78%\">look\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 12% entry 82%\">for\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 16% entry 86%\">answers\u003c/span>\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px\">\n\u003csc-for list=\"{{areas}}\" as=\"a\" hint-placeholder-count=\"6\">\n\u003cdiv style=\"background: #FFFFFF; border-radius: 28px; padding: 32px; display: flex; flex-direction: column; gap: 36px\">\u003cspan style=\"font-size: 14px; color: #9AA59E\">{{a.n}}\u003c/span>\u003cspan style=\"display: flex; flex-direction: column; gap: 10px\">\u003cspan class=\"h3\">{{a.t}}\u003c/span>\u003cspan style=\"font-size: 16.5px; line-height: 1.6; color: #5E5E5E\">{{a.d}}\u003c/span>\u003c/span>\u003c/div>\n\u003c/sc-for>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"wrap sec\">\n\u003cdiv class=\"head\">\n\u003cspan class=\"eyebrow\">Research partnerships\u003c/span>\n\u003ch2 class=\"h2\">\u003cspan class=\"w\" style=\"animation-range: entry 0% entry 70%\">Collaborating\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 4% entry 74%\">with\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 8% entry 78%\">leading\u003c/span> \u003cspan class=\"w\" style=\"animation-range: entry 12% entry 82%\">institutions\u003c/span>\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px\">\n\u003csc-for list=\"{{partners}}\" as=\"p\" hint-placeholder-count=\"6\">\u003cdiv style=\"border: 1px solid #E6EBE5; border-radius: 22px; padding: 28px 24px; min-height: 110px; box-sizing: border-box; display: flex; align-items: flex-end; font-weight: 500; font-size: 18px; letter-spacing: -0.01em; line-height: 1.3\">{{p}}\u003c/div>\u003c/sc-for>\n\u003c/div>\n\u003cdiv style=\"margin-top: clamp(64px, 7vw, 104px); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 24px\">\n\u003ch2 class=\"h2\">\u003cspan class=\"w\" style=\"animatio n.target.setAttribute('data-in', ''); this.__io.unobserve(en.target); }\n        });\n      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n      els.forEach((el) => this.__io.observe(el));\n    } catch (e) {}\n  }\n  constructor(props) { super(props); this.state = { more: false }; }\n  renderVals() {\n    const more = this.state.more;\n    return { fontName: (this.props.font ?? 'Work Sans'), fontStack: \"'\" + (this.props.font ?? 'Work Sans') + \"', system-ui, sans-serif\", \n      more,\n      moreStr: more ? 'true' : 'false',\n      moreLabel: more ? 'Show less' : 'Read about the study',\n      toggle: () => this.setState({ more: !more }),\n      areas: [\n        { t: 'Nutrition & Child Health', d: 'Community-based approaches to malnutrition, maternal nutrition, and early childhood development.' },\n        { t: 'Maternal & Reproductive Health', d: 'Improving maternal health outcomes through evidence-based prenatal, delivery, and postnatal care.' },\n        { t: 'Community Health Systems', d: 'Strengthening healthcare delivery models for rural and underserved populations.' },\n        { t: 'Infectious Disease Management', d: 'Prevention, treatment, and control strategies for communicable diseases in community settings.' },\n        { t: 'Chronic Disease Prevention', d: 'Lifestyle interventions and early detection programs for diabetes, hypertension, and NCDs.' },\n        { t: 'Health Education & Literacy', d: 'Innovative approaches to health awareness, education, and behavior change communication.' }\n      ].map((a, i) => ({ ...a, n: String(i + 1).padStart(2, '0') })),\n      partners: ['Azim Premji University', 'Indian Council of Medical Research (ICMR)', 'National Health Mission, Madhya Pradesh', 'Emmanuel Hospital Association', 'Christian Medical Association of India', 'Public Health Foundation of India']\n    };\n  }\n}\n","props":{"$preview":{"width":1440,"height":3600}}}}};</script>
