<script>window.__DC={"entry":"Privacy.dc.html","files":{"Privacy.dc.html":{"tpl":"\n\u003cdiv class=\"page\" lang=\"en\" style=\"font-family: 'Satoshi', 'Poppins', system-ui, sans-serif; color: #0D1410; background: #FFFFFF\">\n\u003cdc-import name=\"Nav\" current=\"home\" hint-size=\"100%,112px\">\u003c/dc-import>\n\u003csection class=\"wrap\" style=\"padding-top: 40px; padding-bottom: 64px\">\n\u003cdiv style=\"max-width: 820px; margin: 0 auto\" class=\"prose\">\n\u003cspan class=\"tag\">Legal\u003c/span>\n\u003ch1 class=\"h1\" style=\"font-size: clamp(38px, 4vw, 54px); margin-top: 14px\">Privacy policy\u003c/h1>\n\u003cp style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\">Draft for review by the hospital · \u003cspan class=\"tbc\">Effective date to be confirmed\u003c/span>\u003c/p>\n\u003cp>Christian Hospital Chhatarpur (\"we\") respects your privacy. This policy explains what information this website collects and how we use it. It does not cover medical records, which are kept under the hospital's clinical record policies.\u003c/p>\n\u003ch3>Information we collect\u003c/h3>\n\u003cul>\u003cli>When you use the \"Send us a message\" form, your name, phone number, topic and message are placed into an email in your own email app. They reach us only if you send that email.\u003c/li>\u003cli>If you email or call us, we receive the details you choose to share.\u003c/li>\u003cli>This website does not ask you to create an account and does not store your details on the website itself.\u003c/li>\u003c/ul>\n\u003ch3>How we use it\u003c/h3>\n\u003cul>\u003cli>To reply to your enquiry, arrange your visit or respond to a request about admissions, volunteering, donations or jobs.\u003c/li>\u003cli>We do not sell your information or use it for advertising.\u003c/li>\u003c/ul>\n\u003ch3>Services from other companies\u003c/h3>\n\u003cp>Some pages show a map from Google Maps and load fonts from external font services. These services may receive technical information such as your IP address under their own privacy policies.\u003c/p>\n\u003ch3>Keeping information safe\u003c/h3>\n\u003cp>Enquiry emails are accessed only by hospital staff who need them to respond, and are kept only as long as needed.\u003c/p>\n\u003ch3>Your choices\u003c/h3>\n\u003cp>You can ask us to see, correct or delete the details you have sent us by writing to \u003ca href=\"mailto:chhatarpur@eha-health.org\">chhatarpur@eha-health.org\u003c/a>.\u003c/p>\n\u003ch3>Contact\u003c/h3>\n\u003cp>Christian Hospital Chhatarpur, Mahoba Road, Chhatarpur, Madhya Pradesh 471 001 · \u003ca href=\"mailto:chhatarpur@eha-health.org\">chhatarpur@eha-health.org\u003c/a>\u003c/p>\n\u003cp style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\">Grievance / data contact person: \u003cspan class=\"tbc\">Name and designation\u003c/span>\u003c/p>\n\u003c/div>\n\u003c/section>\n\u003cdc-import name=\"Footer\" hint-size=\"100%,460px\">\u003c/dc-import>\n\u003c/div>\n","script":"\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._t = setInterval(() => this.forceUpdate(), 60000);\n    requestAnimationFrame(() => setTimeout(() => this.__rv(), 30));\n  }\n  componentWillUnmount() { clearInterval(this._t); if (this.__io) this.__io.disconnect(); }\n  __rv() {\n    try {\n      if (typeof window === 'undefined' || !('IntersectionObserver' in window)) return;\n      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n      const root = document.querySelector('.page');\n      if (!root) return;\n      const sel = 'section:not(.hero) :is(.tag,.eyebrow,h2,h3,p,li,img,.btn,figure,blockquote,form,[data-a],[style*=\"grid-template-columns\"] > *)';\n      const all = Array.from(root.querySelectorAll(sel));\n      const els = all.filter((el) => !all.some((o) => o !== el && o.contains(el)));\n      const counts = new Map();\n      els.forEach((el) => {\n        const p = el.parentElement;\n        const i = counts.get(p) || 0;\n        counts.set(p, i + 1);\n        el.setAttribute('data-a', '');\n        if (i) el.style.transitionDelay = Math.min(i * 90, 450) + 'ms';\n      });\n      document.documentElement.setAttribute('data-anim', 'on');\n      this.__io = new IntersectionObserver((entries) => {\n        entries.forEach((en) => {\n          if (en.isIntersecting) { en.target.setAttribute('data-in', ''); this.__io.unobserve(en.target); }\n        });\n      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n      els.forEach((el) => this.__io.observe(el));\n    } catch (e) {}\n  }\n  opd() {\n    // OPD closed on Sundays and on these holidays (emergency stays open). Edit as the hospital announces closures.\n    // 'MM-DD' repeats every year; 'YYYY-MM-DD' is a one-off date.\n    const HOLIDAYS = ['01-26', '08-15', '10-02', '12-25'];\n    const now = new Date();\n    const ist = new Date(now.getTime() + (330 + now.getTimezoneOffset()) * 60000);\n    const p2 = (n) => String(n).padStart(2, '0');\n    const md = (dt) => p2(dt.getMonth() + 1) + '-' + p2(dt.getDate());\n    const isHol = (dt) => HOLIDAYS.includes(md(dt)) || HOLIDAYS.includes(dt.getFullYear() + '-' + md(dt));\n    const hours = (dt) => (dt.getDay() === 0 || isHol(dt)) ? null : (dt.getDay() === 6 ? [8, 11.5, '11:30 am'] : [8, 14.5, '2:30 pm']);\n    const h = ist.getHours() + ist.getMinutes() / 60;\n    const today = hours(ist);\n    if (today && h >= today[0] && h \u003c today[1]) return { open: true, t: 'OPD open now', s: 'Until ' + today[2] + ' today', nav: 'OPD open now · until ' + today[2], line: 'OPD open now · Emergency open 24 hours' };\n    if (today && h \u003c today[0]) return { open: false, t: 'OPD opens at 8:00 am', s: 'Emergency is open now', nav: 'OPD opens today at 8:00 am', line: 'OPD opens at 8:00 am · Emergency open 24 hours' };\n    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];\n    let next = 'soon';\n    for (let i = 1; i \u003c 14; i++) { const dt = new Date(ist.getTime() + i * 86400000); if (hours(dt)) { next = i === 1 ? 'tomorrow' : days[dt.getDay()]; break; } }\n    const hol = isHol(ist);\n    return {\n      open: false,\n      t: hol ? 'OPD closed today · holiday' : 'OPD opens ' + next,\n      s: hol ? 'Opens ' + next + ' · Emergency open' : 'Emergency is open now',\n      nav: (hol ? 'OPD closed today (holiday) · opens ' : 'OPD opens ') + next + ' at 8:00 am',\n      line: (hol ? 'OPD closed today (holiday) · opens ' : 'OPD opens ') + next + ' 8:00 am · Emergency open 24 hours'\n    };\n  }\n  renderVals() { return {}; }\n}\n","props":{"$preview":{"width":1440,"height":2600}}}}};</script>
