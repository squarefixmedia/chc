rder-radius: 80px; padding: 9px 16px\">Approved intake: 30 students\u003c/span>\n\u003cspan style=\"background: rgba(255,255,255,.1); border-radius: 80px; padding: 9px 16px\">Affiliated to MPNRC, Bhopal\u003c/span>\n\u003cspan style=\"background: rgba(255,255,255,.1); border-radius: 80px; padding: 9px 16px\">INC School Code: 1802039\u003c/span>\n\u003c/div>\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px\">\n\u003ca class=\"btn\" href=\"/school-of-nursing#eligibility\" style=\"background: #FFFFFF; color: #4E2F78\">Check eligibility\u003c/a>\n\u003ca class=\"btn\" href=\"tel:07682249317\" style=\"background: rgba(255,255,255,.12); color: #FFFFFF\">Call 07682-249317\u003c/a>\n\u003c/div>\n\u003c/div>\n\u003cimg src=\"/assets/nurses-documentation.webp\" alt=\"Two nurses writing up patient records\" style=\"flex: 1 1 380px; min-width: 0; min-height: 360px; object-fit: cover\">\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003c!-- BEYOND -->\n\u003csection class=\"sec\">\n\u003cdiv class=\"wrap\">\n\u003cdiv class=\"head\">\n\u003cspan class=\"tag\">Beyond the hospital\u003c/span>\n\u003ch2 class=\"h2\">Care that reaches homes and villages\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px\">\n\u003csc-for list=\"{{beyond}}\" as=\"b\" hint-placeholder-count=\"3\">\n\u003ca class=\"card-l\" href=\"{{b.href}}\" style=\"text-decoration: none; color: #0D1410; background: #F3F8F2; border-radius: 28px; padding: 12px 12px 28px; display: flex; flex-direction: column; gap: 22px\">\n\u003cdiv class=\"zoom\" style=\"border-radius: 20px; aspect-ratio: 16 / 11\">\u003cimg src=\"{{b.img}}\" alt=\"{{b.alt}}\" style=\"width: 100%; height: 100%; object-fit: cover; display: block\">\u003c/div>\n\u003cspan style=\"display: flex; flex-direction: column; gap: 8px; padding: 0 16px\">\u003cspan style=\"font-size: 15px; color: #1D7A3E\">{{b.k}}\u003c/span>\u003cspan style=\"font-size: 22px; letter-spacing: -0.03em; line-height: 1.3\">{{b.t}}\u003c/span>\u003cspan style=\"font-size: 16px; line-height: 1.55; color: #5E5E5E\">{{b.d}}\u003c/span>\u003c/span>\n\u003c/a>\n\u003c/sc-for>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003c!-- NEWS -->\n\u003csection class=\"sec\">\n\u003cdiv class=\"wrap\">\n\u003cdiv style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 40px\">\n\u003cdiv style=\"display: flex; flex-direction: column; gap: 14px\">\u003cspan class=\"tag\">News &amp; notices\u003c/span>\u003ch2 class=\"h2\">What's happening at CCH\u003c/h2>\u003c/div>\n\u003ca class=\"btn btn-o\" href=\"/news\">All notices\u003c/a>\n\u003c/div>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px\">\n\u003csc-for list=\"{{news}}\" as=\"n\" hint-placeholder-count=\"3\">\n\u003ca class=\"card-l\" href=\"/news\" style=\"text-decoration: none; color: #0D1410; border: 1px solid #E6EBE5; border-radius: 28px; padding: 30px; display: flex; flex-direction: column; gap: 14px\">\n\u003cspan style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px\">\u003cspan style=\"font-size: 14px; color: #1D7A3E; background: #F3F8F2; border-radius: 80px; padding: 5px 12px\">{{n.k}}\u003c/span>\u003cspan style=\"font-size: 14px; color: #5E5E5E\">{{n.d}}\u003c/span>\u003c/span>\n\u003cspan style=\"font-size: 22px; letter-spacing: -0.03em; line-height: 1.3\">{{n.t}}\u003c/span>\n\u003cspan style=\"font-size: 16px; line-height: 1.55; color: #5E5E5E\">{{n.x}}\u003c/span>\n\u003c/a>\n\u003c/sc-for>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003c!-- STORIES -->\n\u003csection class=\"sec\">\n\u003cdiv class=\"wrap\">\n\u003cdiv class=\"head\">\u003cspan class=\"tag\">Patient stories\u003c/span>\u003ch2 class=\"h2\">Families we have cared for\u003c/h2>\u003cp class=\"lead\">Stories from our maternity ward and NICU, shared with the families' permission.\u003c/p>\u003c/div>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px\">\n\u003csc-for list=\"{{stories}}\" as=\"s\" hint-placeholder-count=\"2\">\n\u003cfigure style=\"margin: 0; background: #F3F8F2; border-radius: 28px; overflow: hidden; display: flex; flex-wrap: wrap\">\n\u003cimg src=\"{{s.img}}\" alt=\"{{s.alt}}\" style=\"flex: 1 1 200px; min-width: 0; min-height: 260px; object-fit: cover\">\n\u003cfigcaption style=\"flex: 1.2 1 240px; min-width: 0; padding: 30px; display: flex; flex-direction: column; gap: 16px; justify-content: center\">\n\u003cspan style=\"font-size: 15px; color: #1D7A3E\">{{s.k}}\u003c/span>\n\u003cspan style=\"font-size: 20px; line-height: 1.45; letter-spacing: -0.02em; color: #5E5E5E\">{{s.q}}\u003c/span>\n\u003cspan class=\"tbc\" style=\"align-self: flex-start\">Awaiting a family's story and consent\u003c/span>\n\u003c/figcaption>\n\u003c/figure>\n\u003c/sc-for>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003c!-- FAQ -->\n\u003csection class=\"sec\">\n\u003cdiv class=\"wrap\" style=\"max-width: 960px\">\n\u003cdiv class=\"head\">\n\u003cspan class=\"tag\">FAQ\u003c/span>\n\u003ch2 class=\"h2\">Questions patients often ask\u003c/h2>\n\u003c/div>\n\u003cdiv style=\"border-top: 1px solid #E6EBE5\">\n\u003csc-for list=\"{{faq}}\" as=\"q\" hint-placeholder-count=\"6\">\n\u003cdetails>\u003csummary>{{q.q}}\u003cspan class=\"plus\" aria-hidden=\"true\">\u003c/span>\u003c/summary>\u003cp>{{q.a}}\u003c/p>\u003c/details>\n\u003c/sc-for>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003c!-- CTA -->\n\u003csection class=\"sec\" style=\"padding-top: 24px\">\n\u003cdiv class=\"wrap\">\n\u003cdiv style=\"position: relative; overflow: hidden; background: #1D7A3E; color: #FFFFFF; border-radius: 32px; padding: clamp(40px, 6vw, 80px) clamp(28px, 5vw, 64px); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px\">\n\u003csvg viewBox=\"0 0 220 30\" aria-hidden=\"true\" preserveAspectRatio=\"none\" style=\"position: absolute; left: 0; right: 0; top: 50%; width: 100%; height: 120px; transform: translateY(-50%); opacity: .12\">\u003cpath d=\"M0,15 H30 L38,4 L46,26 L54,15 H84 L92,4 L100,26 L108,15 H140 L148,4 L156,26 L164,15 H220\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\".6\">\u003c/path>\u003c/svg>\n\u003cspan class=\"tag\" style=\"color: #FFFFFF; --dot: #9BE7B0; position: relative\">We are here 24 hours a day\u003c/span>\n\u003ch2 class=\"h2\" style=\"color: #FFFFFF; max-width: 720px; position: relative\">Need care today? Talk to us.\u003c/h2>\n\u003cp class=\"lead\" style=\"color: rgba(255,255,255,.78); max-width: 560px; position: relative\">Call our emergency line any time, or visit the OPD on Mahoba Road from Monday to Saturday.\u003c/p>\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; position: relative\">\n\u003ca class=\"btn\" href=\"tel:07682244311\" style=\"background: #FFFFFF; color: #0D1410\">Call 07682-244311\u003c/a>\n\u003ca class=\"btn\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Christian%20Hospital%20Chhatarpur%20Mahoba%20Road%20Chhatarpur%20Madhya%20Pradesh%20471001\" target=\"_blank\" rel=\"noopener\" style=\"background: rgba(255,255,255,.14); color: #FFFFFF\">Get directions ↗\u003c/a>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003cdc-import name=\"Footer\" hint-size=\"100%,560px\">\u003c/dc-import>\n\u003c/div>\n","script":"\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._t = setInterval(() => this.forceUpdate(), 60000);\n    requestAnimationFrame(() => setTimeout(() => this.__rv(), 30));\n  }\n  componentWillUnmount() { clearInterval(this._t); if (this.__io) this.__io.disconnect(); }\n  __rv() {\n    try {\n      if (typeof window === 'undefined' || !('IntersectionObserver' in window)) return;\n      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n      const root = document.querySelector('.page');\n      if (!root) return;\n      const sel = 'section:not(.hero) :is(.tag,.eyebrow,h2,h3,p,li,img,.btn,figure,blockquote,form,[data-a],[style*=\"grid-template-columns\"] > *)';\n      const all = Array.from(root.querySelectorAll(sel));\n      const els = all.filter((el) => !all.some((o) => o !== el && o.contains(el)));\n      const counts = new Map();\n      els.forEach((el) => {\n        const p = el.parentElement;\n        const i = counts.get(p) || 0;\n        counts.set(p, i + 1);\n        el.setAttribute('data-a', '');\n        if (i) el.style.transitionDelay = Math.min(i * 90, 450) + 'ms';\n      });\n      document.documentElement.setAttribute('data-anim', 'on');\n      this.__io = new IntersectionObserver((entries) => {\n        entries.forEach((en) => {\n          if (en.isIntersecting) { en.target.setAttribute('data-in', ''); this.__io.unobserve(en.target); }\n        });\n      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n      els.forEach((el) => this.__io.observe(el));\n    } catch (e) {}\n  }\n  opd() {\n    // OPD closed on Sundays and on these holidays (emergency stays open). Edit as the hospital announces closures.\n    // 'MM-DD' repeats every year; 'YYYY-MM-DD' is a one-off date.\n    const HOLIDAYS = ['01-26', '08-15', '10-02', '12-25'];\n    const now = new Date();\n    const ist = new Date(now.getTime() + (330 + now.getTimezoneOffset()) * 60000);\n    const p2 = (n) => String(n).padStart(2, '0');\n    const md = (dt) => p2(dt.getMonth() + 1) + '-' + p2(dt.getDate());\n    const isHol = (dt) => HOLIDAYS.includes(md(dt)) || HOLIDAYS.includes(dt.getFullYear() + '-' + md(dt));\n    const hours = (dt) => (dt.getDay() === 0 || isHol(dt)) ? null : (dt.getDay() === 6 ? [8, 11.5, '11:30 am'] : [8, 14.5, '2:30 pm']);\n    const h = ist.getHours() + ist.getMinutes() / 60;\n    const today = hours(ist);\n    if (today && h >= today[0] && h \u003c today[1]) return { open: true, t: 'OPD open now', s: 'Until ' + today[2] + ' today', nav: 'OPD open now · until ' + today[2], line: 'OPD open now · Emergency open 24 hours' };\n    if (today && h \u003c today[0]) return { open: false, t: 'OPD opens at 8:00 am', s: 'Emergency is open now', nav: 'OPD opens today at 8:00 am', line: 'OPD opens at 8:00 am · Emergency open 24 hours' };\n    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];\n    let next = 'soon';\n    for (let i = 1; i \u003c 14; i++) { const dt = new Date(ist.getTime() + i * 86400000); if (hours(dt)) { next = i === 1 ? 'tomorrow' : days[dt.getDay()]; break; } }\n    const hol = isHol(ist);\n    return {\n      open: false,\n      t: hol ? 'OPD closed today · holiday' : 'OPD opens ' + next,\n      s: hol ? 'Opens ' + next + ' · Emergency open' : 'Emergency is open now',\n      nav: (hol ? 'OPD closed today (holiday) · opens ' : 'OPD opens ') + next + ' at 8:00 am',\n      line: (hol ? 'OPD closed today (holiday) · opens ' : 'OPD opens ') + next + ' 8:00 am · Emergency open 24 hours'\n    };\n  }\n\n  renderVals() {\n    const o = this.opd();\n    const W = (k, t, d) => ({ k, t, d });\n    const S = (name, desc, icon) => ({ name, desc, icon });\n    const F = (t, d, icon) => ({ t, d, icon });\n    const ic = {\"women\": \"M12 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM8 21v-5a4 4 0 0 1 8 0v5\", \"child\": \"M12 4a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM6 21c1-3 3-5 6-5s5 2 6 5\", \"steth\": \"M6 3v6a6 6 0 0 0 12 0V3M12 15v3a3 3 0 0 0 6 0v-1\", \"surg\": \"M4 20l9-9M14 4l6 6-5 5-6-6z\", \"pulse\": \"M3 12h4l2-5 4 10 2-5h6\", \"mind\": \"M12 3a7 7 0 0 0-7 7c0 2 1 4 3 5v4h8v-4c2-1 3-3 3-5a7 7 0 0 0-7-7z\", \"lab\": \"M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3\", \"tooth\": \"M7 3c-2 0-3 2-3 4 0 4 2 6 2 10 0 2 1 4 2 4s2-3 2-5 1-3 2-3 2 1 2 3 1 5 2 5 2-2 2-4c0-4 2-6 2-10 0-2-1-4-3-4-2 0-3 1-5 1S9 3 7 3z\", \"pill\": \"M10.5 20.5a5 5 0 0 1-7-7l7-7a5 5 0 0 1 7 7zM7 10l7 7\", \"amb\": \"M3 17V7h11v10M14 10h4l3 3v4h-7M7 17a2 2 0 1 0 0 .1M17 17a2 2 0 1 0 0 .1M8.5 9v4M6.5 11h4\", \"xray\": \"M4 4h16v16H4zM12 7v10M8 9h8M8 12h8M9 15h6\", \"shield\": \"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4\", \"heart\": \"M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z\", \"eye\": \"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z\", \"target\": \"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 11.5v1\", \"bed\": \"M3 18V6M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5M7 11a1.5 1.5 0 1 0 0 .1\", \"nurse\": \"M12 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM5 21c1-4 3.5-6 7-6s6 2 7 6M12 5v4M10 7h4\", \"clock\": \"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2\", \"home\": \"M3 11l9-7 9 7M5 10v10h14V10M10 20v-5h4v5\", \"book\": \"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5M8 7h7\", \"search\": \"M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4\"};\n    return {\n      opdText: o.t,\n      opdColor: o.open ? '#7BE08A' : '#F2C94C',\n      opdPulse: o.open ? 'pulse' : '',\n      stats: [\n        { n: 100, txt: '', suf: '', cls: 'count', l: 'Beds, incl. ICU & NICU', icon: ic.bed, sep: '' },\n        { n: 75, txt: '', suf: '', cls: 'count', l: 'Nurses on our wards', icon: ic.nurse, sep: 'border-left: 1px solid rgba(255,255,255,.18);' },\n        { n: 24, txt: '', suf: ' hr', cls: 'count', l: 'Emergency care', icon: ic.pulse, sep: 'border-left: 1px solid rgba(255,255,255,.18);' },\n        { n: 1930, txt: '1930', suf: '', cls: '', l: 'Serving since', icon: ic.heart, sep: 'border-left: 1px solid rgba(255,255,255,.18);' }\n      ],\n      why: [\n        W('01', 'Whole person care since 1930', 'Nearly a century of compassionate care for every patient who walks in.'),\n        W('02', 'NABH Entry Level, pre-accredited', 'Infection prevention, patient safety, documentation and continuous quality improvement.'),\n        W('03', '24-hour emergency and critical care', 'Casualty, ICU, NICU and ambulance services, round the clock.'),\n        W('04', 'Trained, supervised nursing', 'Rotational senior nursing supervision on every evening and night shift.')\n      ],\n      services: [\n        S('Obstetrics & Gynaecology', 'Labour room, safe deliveries and postnatal care.', ic.women),\n        S('Paediatrics', 'Children’s OPD and wards, with a Neonatal ICU.', ic.child),\n        S('General Medicine', 'Care for everyday and chronic illness.', ic.steth),\n        S('General Surgery', 'Operation theatre with pre- and post-operative care.', ic.surg),\n        S('Emergency & Casualty', 'Open 24 hours, with ambulance services.', ic.pulse),\n        S('Psychiatry & Mental Health', 'Psychiatric OPD, IPD and counselling.', ic.mind)\n      ],\n      facilities: [\n        F('24-hour Emergency', 'Casualty services open day and night, every day of the week.', ic.pulse),\n        F('Clinical Laboratory', 'Haematology, biochemistry, microbiology and serology investigations.', ic.lab),\n        F('Radiology & Imaging', 'X-Ray, ECG and other routine diagnostic investigations.', ic.xray),\n        F('Hospital Pharmacy', 'An in-house pharmacy on the hospital campus.', ic.pill),\n        F('Ambulance & Transport', 'Ambulance and patient transport services.', ic.amb),\n        F('Infection Control', 'Central sterile supply and biomedical waste management systems.', ic.shield)\n      ],\n      story: [\n        { y: '1925', t: 'The founders', c: 'Ms. Esther Baird and Ms. Delia Fistler of the Friends Foreign Missionary Society.', img: '/assets/founders-1925.webp', alt: 'The founding missionaries, 1925', cls: 'archive' },\n        { y: 'Outreach', t: 'Free eye services for rural India', c: 'Eye camps took care beyond the hospital walls.', img: '/assets/archive-eye-camp.webp', alt: 'A CHC eye camp under Dr. Mategaonkar', cls: 'archive' },\n        { y: 'Today', t: 'A 100 bed hospital', c: 'Emergency, ICU, NICU, 75 nurses and a growing palliative care service.', img: '/assets/entrance-gate.webp', alt: 'The hospital entrance on Mahoba Road today', cls: '' }\n      ],\n      beyond: [\n        { href: '/services#palliative', k: 'Developing in 2025–26', t: 'Palliative & Supportive Care', d: 'Holistic, compassionate and dignified care, with counselling and family support.', img: '/assets/palliative-patient.webp', alt: 'A patient in a wheelchair with his family' },\n        { href: '/community', k: 'Community health', t: 'Health Camps & Outreach', d: 'Health education, preventive care and livelihood programmes with rural communities.', img: '/assets/community-serving.webp', alt: 'Community members at a health outreach programme' },\n        { href: '/research', k: 'Research', t: 'Learning from our patients', d: 'Clinical and community studies that help us improve care in Bundelkhand.', img: '/assets/eye-exam.webp', alt: 'An eye examination at the hospital' }\n      ],\n      news: [\n        { k: 'Admissions', d: '2026–27', t: 'GNM admissions', x: 'Next admission dates will be announced here. Call the School office on 07682-249317.' },\n        { k: 'Services', d: '2025–26', t: 'Palliative care services', x: 'We are developing palliative and supportive care, with counselling and family support.' },\n        { k: 'OPD', d: 'Holidays', t: 'Holiday OPD closures', x: 'On public holidays the OPD is closed. Emergency stays open 24 hours.' }\n      ],\n      stories: [\n        { k: 'Maternity', q: 'A mother’s story of a safe delivery at CCH will appear here.', img: '/assets/nurse-mother-baby.webp', alt: 'A nurse caring for a mother and her newborn' },\n        { k: 'Neonatal ICU', q: 'A family’s story from our NICU will appear here.', img: '/assets/nicu-incubator.webp', alt: 'A newborn in an incubator in the NICU' }\n      ],\n      faq: [\n        { q: 'What are the OPD timings?', a: 'The OPD is open Monday to Friday from 08:00 am to 2:30 pm, and on Saturday from 08:00 am to 11:30 am. On Sundays only emergency services are available.' },\n        { q: 'Is the emergency department open 24 hours?', a: 'Yes. Emergency and casualty services, with ambulance support, are open 24 hours a day, every day. Call 07682-244311.' },\n        { q: 'Where is the hospital?', a: 'Christian Hospital Chhatarpur, Mahoba Road, Dist: Chhatarpur, Madhya Pradesh 471 001.' },\n        { q: 'Does the hospital have an ICU and NICU?', a: 'Yes. The hospital has an Intensive Care Unit and a Neonatal ICU, cared for by our nursing team, with senior nursing supervision on evening and night shifts.' },\n        { q: 'How do I apply to the School of Nursing?', a: 'The School offers the 3-year GNM programme with an approved intake of 30 students. Call the School office on 07682-249317 or 7869965406 for admission details.' },\n        { q: 'How can I contact the hospital?', a: 'Email chhatarpur@eha-health.org, or call the emergency line on 07682-244311.' }\n      ]\n    };\n  }\n}\n","props":{"$preview":{"width":1440,"height":8200}}}}};</script>
